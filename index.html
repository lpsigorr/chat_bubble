<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSMIT — Real-time Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-box">
                <h1 class="logo">TRANSMIT</h1>
                <p class="tagline">Simple. Direct. Real-time.</p>
                <div class="input-group">
                    <label for="usernameInput">ENTER USERNAME</label>
                    <input type="text" id="usernameInput" placeholder="anonymous" maxlength="20">
                </div>
                <button id="joinBtn" class="primary-btn">JOIN TRANSMISSION</button>
            </div>
        </div>

        <!-- Chat Screen -->
        <div id="chatScreen" class="screen">
            <div class="chat-container">
                <!-- Header -->
                <div class="chat-header">
                    <div class="header-left">
                        <h2 class="logo-small">TRANSMIT</h2>
                        <div class="status-indicator">
                            <span class="pulse"></span>
                            <span id="onlineCount">0</span> LIVE
                        </div>
                    </div>
                    <div class="header-right">
                        <span id="currentUsername" class="username-display"></span>
                        <button id="logoutBtn" class="logout-btn">EXIT</button>
                    </div>
                </div>

                <!-- Messages Area -->
                <div class="messages-container" id="messagesContainer">
                    <div class="messages-inner" id="messagesInner"></div>
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="messageInput" 
                            placeholder="Type message..."
                            maxlength="500"
                        >
                        <button id="sendBtn" class="send-btn">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M2 10L18 2L10 18L8 11L2 10Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-info">
                        <span id="charCount">0/500</span>
                        <span class="typing-indicator" id="typingIndicator"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
